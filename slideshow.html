<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New York City Trip · Slideshow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-city">NYC</span>
      <span class="brand-sub">Trip to New York City</span>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link">Overview</a>
      <a href="timeline.html" class="nav-link">Timeline</a>
      <a href="slideshow.html" class="nav-link active">Slideshow</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-head">
    <h1>Stop by stop</h1>
    <p class="page-sub">One big picture for each place we'll go — with why it's exciting, how long it takes to get there, and links to open in Google Maps.</p>
  </div>

  <div class="slide-stage" id="stage">
    <div class="slide" id="slide"></div>
    <div class="slide-nav">
      <button class="slide-btn" id="prev" aria-label="Previous">‹</button>
      <div class="slide-counter" id="counter">1 / 1</div>
      <button class="slide-btn" id="next" aria-label="Next">›</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>Our NYC Trip · Nov 16–18, 2026</span>
    <span class="footer-links"><a href="index.html">Overview</a><a href="timeline.html">Timeline</a></span>
  </div>
</footer>

<script src="data.js"></script>
<script>
(function(){
  var slides = window.TRIP.slides;
  var idx = 0;
  var stage = document.getElementById("slide");
  var counter = document.getElementById("counter");
  document.getElementById("prev").onclick = function(){ idx=(idx-1+slides.length)%slides.length; render(); };
  document.getElementById("next").onclick = function(){ idx=(idx+1)%slides.length; render(); };

  function gapBlock(gap){
    if(!gap) return "";
    var h = "<div class=\"slide-gap\">";
    h += "<span class=\"tl-gap-label\">✨ " + gap.text + "</span>";
    h += "<span class=\"tl-gap-sub\">Ideas to fill it:</span> ";
    (gap.suggestions||[]).forEach(function(k){
      var p = window.TRIP.places ? window.TRIP.places[k] : null;
      if(p){
        h += "<a class=\"tl-free-chip\" href=\"" + p.gmaps + "\" target=\"_blank\" rel=\"noopener\">"+p.name+"</a>";
      }
    });
    h += "</div>";
    return h;
  }

  function render(){
    var s = slides[idx];
    var travel = s.travel||{};
    var travelLine = travel.name ? "Getting here: from " + travel.name : "";
    var travelMode = travel.mode==="walk" ? " (~"+travel.min+" min walk)"
                    : travel.mode==="taxi" ? " (~"+travel.min+" min by taxi)"
                    : travel.mode==="flight" ? " (by flight)" : "";
    var opts = "";
    if(s.options){
      opts = "<div class=\"slide-options\">";
      opts += "<span class=\"tl-options-label\">Pick one:</span> ";
      s.options.forEach(function(o){
        opts += "<a class=\"tl-free-chip\" href=\"" + o.gmaps + "\" target=\"_blank\" rel=\"noopener\">"+o.name+"</a>";
      });
      opts += "</div>";
    }
    var note = s.note ? "<p class=\"slide-note\">💡 " + s.note + "</p>" : "";
    stage.innerHTML =
      "<div class=\"slide-img-wrap\">" +
        "<img src=\"assets/"+s.photo+"\" alt=\""+s.name+"\">" +
        "<div class=\"slide-img-label\">"+s.name+"</div>" +
      "</div>" +
      "<div class=\"slide-info\">" +
        "<div class=\"slide-day\">"+s.day+" · "+s.time+"</div>" +
        "<h2 class=\"slide-name\">"+s.name+"</h2>" +
        "<div class=\"slide-type\">"+s.type+"</div>" +
        "<p class=\"slide-action\">"+s.action+"</p>" +
        note +
        (travelLine ? "<p class=\"slide-travel\">"+travelLine+travelMode+"</p>" : "") +
        (s.hours ? "<p class=\"slide-hours\">🕒 "+s.hours+"</p>" : "") +
        opts +
        "<div class=\"slide-gap-wrap\">" + gapBlock(s.gap) + "</div>" +
        "<div class=\"slide-links\">" +
          "<a href=\""+s.gmaps+"\" target=\"_blank\" rel=\"noopener\">📍 Google Maps</a>" +
          (s.website ? "<a href=\""+s.website+"\" target=\"_blank\" rel=\"noopener\">🔗 Website</a>" : "") +
        "</div>" +
      "</div>";
    counter.textContent = (idx+1) + " / " + slides.length;
  }
  render();
})();
</script>
</body>
</html>
