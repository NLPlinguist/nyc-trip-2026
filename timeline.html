<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New York City Trip · Timeline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-city">NYC</span>
      <span class="brand-sub">Trip to New York City</span>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link">Overview</a>
      <a href="timeline.html" class="nav-link active">Timeline</a>
      <a href="slideshow.html" class="nav-link">Slideshow</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-head">
    <h1>Day-by-day timeline</h1>
    <p class="page-sub">Travel times are approximate, based on typical NYC taxi / walking distances. Little gaps are marked with ideas to fill them.</p>
  </div>

  <div id="timeline"></div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>Our NYC Trip · Nov 16–18, 2026</span>
    <span class="footer-links"><a href="index.html">Overview</a><a href="slideshow.html">Slideshow</a></span>
  </div>
</footer>

<script src="data.js"></script>
<script>
(function(){
  var trip = window.TRIP;
  var wrap = document.getElementById("timeline");

  function modeLabel(m, min){
    if(!m) return "";
    if(m==="flight") return "✈ Flight";
    if(m==="walk") return "🚶 " + min + " min walk";
    if(m==="taxi") return "🚕 ~" + min + " min taxi/Uber";
    return m;
  }

  function gapBlock(gap){
    if(!gap) return "";
    var h = "<div class=\"tl-gap\">";
    h += "<span class=\"tl-gap-label\">✨ " + gap.text + "</span>";
    h += "<span class=\"tl-gap-sub\">Ideas to fill it:</span> ";
    (gap.suggestions||[]).forEach(function(k){
      var p = trip.places ? trip.places[k] : null;
      if(p){
        h += "<a class=\"tl-free-chip\" href=\"" + p.gmaps + "\" target=\"_blank\" rel=\"noopener\">"+p.name+"</a>";
      }
    });
    h += "</div>";
    return h;
  }

  var html = "";
  trip.days.forEach(function(d){
    html += "<section class=\"tl-day\">";
    html += "<div class=\"tl-day-head\"><span class=\"tl-day-label\">"+d.label+"</span><span class=\"tl-day-date\">"+d.date+"</span></div>";
    html += "<ol class=\"tl-list\">";
    d.stops.forEach(function(s){
      var p = trip.places ? trip.places[s.key] : null;
      var travel = s.travel || {};
      if(travel.name){
        html += "<div class=\"tl-travel\">";
        html += "<span class=\"tl-travel-mode\">"+modeLabel(travel.mode, travel.min)+"</span> ";
        html += "<span class=\"tl-travel-from\">from "+travel.name+"</span>";
        if(travel.note){ html += " <span class=\"tl-travel-note\">("+travel.note+")</span>"; }
        html += "</div>";
      }
      html += "<div class=\"tl-card\">";
      html += "<div class=\"tl-card-top\">";
      html += "<span class=\"tl-time\">"+s.time+"</span>";
      html += "<span class=\"tl-type\">"+(p?p.type:"")+"</span>";
      html += "</div>";
      html += "<div class=\"tl-card-name\">"+s.name+"</div>";
      html += "<div class=\"tl-card-action\">"+s.action+"</div>";
      if(s.note){ html += "<div class=\"tl-note\">"+s.note+"</div>"; }
      if(p && p.options){
        html += "<div class=\"tl-options\">";
        html += "<span class=\"tl-options-label\">Pick one:</span> ";
        p.options.forEach(function(o){
          html += "<a class=\"tl-free-chip\" href=\"" + o.gmaps + "\" target=\"_blank\" rel=\"noopener\">"+o.name+"</a>";
        });
        html += "</div>";
      }
      if(p && p.gmaps){
        html += "<div class=\"tl-card-links\"><a href=\"" + p.gmaps + "\" target=\"_blank\" rel=\"noopener\">📍 Open in Google Maps</a></div>";
      }
      html += "</div>";
      html += "</li>";
      var gap = null;
      if(d.gaps){
        for(var gi=0; gi<d.gaps.length; gi++){
          if(d.gaps[gi].afterKey === s.key){ gap = d.gaps[gi]; break; }
        }
      }
      if(gap){ html += "<div class=\"tl-gap-wrap\">" + gapBlock(gap) + "</div>"; }
    });
    html += "</ol>";
    html += "</section>";
  });

  wrap.innerHTML = html;
})();
</script>
</body>
</html>
